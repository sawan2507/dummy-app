name: Deploy to Cloudways Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.7

      - name: Deploy to Cloudways via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          script: |
            if [ ! -d ~/public_html/.git ]; then
              echo "Git repo not found. Initializing..."
              rm -rf ~/public_html
              git clone https://github.com/sawan2507/dummy-app.git ~/public_html
            else
              cd ~/public_html
              git pull origin main
            fi