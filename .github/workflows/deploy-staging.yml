name: Deploy to Cloudways Staging

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.7

      - name: Deploy to Cloudways via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          script: |
            pwd
            ls -la
            cd $CLOUDWAYS_APP_PATH
            pwd
            ls -la
            git pull origin main
        env:
          CLOUDWAYS_APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}