name: Deploy to Cloudways

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USERNAME }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          port: 22
          script: |
            echo "Navigating to application directory..."
            cd ~/applications/trswxsregt/public_html

            echo "Fetching latest changes from Git..."
            # Resetting helps discard minor file permission drift or local edits on the server
            git fetch --all
            git reset --hard origin/main
            
            echo "Deployment completed successfully!"