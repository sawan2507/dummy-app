name: Deploy to Cloudways

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== Diagnostic Info ==="
            pwd
            cd ~/public_html || exit 1
            pwd

            echo ""
            echo "=== Git Remote Info ==="
            git remote -v

            echo ""
            echo "=== Fetching with HTTPS Token ==="
            git remote set-url origin "https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/sawan2507/dummy-app.git"
            git fetch origin main

            echo ""
            echo "=== Resetting to main ==="
            git reset --hard origin/main

            echo ""
            echo "=== Cleanup: Remove token from config ==="
            git remote set-url origin "https://github.com/sawan2507/dummy-app.git"

            echo ""
            echo "Deployment completed successfully!"