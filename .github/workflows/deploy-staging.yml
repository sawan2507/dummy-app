name: Deploy to Cloudways

on:
  push:
    branches:
      - main  # Change this to 'master' if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            cd ~/public_html || exit 1

            echo "=== Pulling latest PHP code ==="
            git remote set-url origin "https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/sawan2507/dummy-app.git"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git remote set-url origin "https://github.com/sawan2507/dummy-app.git"

            echo "=== Verify deployed files ==="
            pwd
            ls -la

            echo "=== Purging PHP OPcache if available ==="
            php -r 'if (function_exists("opcache_reset")) { opcache_reset(); echo "OPcache reset\n"; } else { echo "OPcache not enabled\n"; }'

            echo "Deployment completed successfully!"